name: Backend CI

on:
  push:
    branches: [main, demo/hackathon-mvp]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      HUSKY: 0
      # DATABASE_URL / DIRECT_URL NO viven aquí, a nivel de job.
      # Estaban aquí y por tanto también los veía el paso `Tests`. Con una URL
      # puesta, las lecturas ESTRICTAS del backend (una lectura ilegible ya no vale
      # por «vacío») intentan conectar a un Postgres que en CI no existe y contestan
      # lo que deben: 503. Medido sobre el candidato del release: 18 suites / 56
      # tests rojos con la URL ficticia, 347 suites / 4.501 tests verdes sin ella —
      # entre los rojos, `institutional.approvals.test.ts`, el tripwire de
      # INVARIANTS #18, que habría salido rojo por el entorno y no por una
      # violación. Un tripwire que grita en falso es un tripwire que se aprende a
      # ignorar. Las dos variables bajan a los únicos pasos que las necesitan.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate
        # Valores ficticios para que el bloque datasource resuelva env(). Estos
        # comandos no abren ninguna conexión real.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      - name: Prisma schema validate
        run: npx prisma validate
        # Valores ficticios para que el bloque datasource resuelva env(). Estos
        # comandos no abren ninguna conexión real.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

      # Blocking: backend must type-check cleanly (it has historically been 0 errors).
      - name: Type-check
        run: npx tsc --noEmit

      # BLOQUEANTE.
      #
      # Dejarlo abierto ahora es peor que cuando estaba justificado: una suite
      # verde que NO puede tumbar el build es una suite que se pudre en silencio,
      # y en los dos últimos días entraron ~60 tests que fijan comportamiento con
      # dinero delante (los topes de Vault V2, la frontera del carril en el tick,
      # que un recibo ilegible no es un fallo). Si esto se rompe, hay que
      # enterarse en el PR y no en mainnet.
      #
      # Si CI se pone rojo tras este cambio, no lo ha roto este cambio: lo está
      # ENSEÑANDO. El equivalente del frontend (vitest) ya bloqueaba.
      - name: Tests
        run: npm test
