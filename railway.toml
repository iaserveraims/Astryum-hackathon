# Railway deployment configuration — DeFiBro backend
#
# Build context: repository root (required so Dockerfile can COPY backend/).
# The Dockerfile (backend/Dockerfile) builds the TypeScript, generates the
# Prisma client, and copies the compiled dist/ into the runner image.
# start.sh runs `prisma migrate deploy` then `node dist/index-simple.js`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
